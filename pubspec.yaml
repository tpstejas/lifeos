name: lifeos
description: "Your Second Brain with Hybrid AI - Capture everything. Organize automatically. Chat with your life."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.5.0
  riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  freezed_annotation: ^3.1.0

  # Navigation
  go_router: ^18.1.4

  # Local Database (Drift)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.2
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Vector Search (sqlite-vec for on-device embeddings)
  # Note: Will use dart:ffi bridge to sqlite-vec or custom implementation

  # Firebase
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_ai: any
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  firebase_messaging: ^17.0.1
  firebase_functions: any
  firebase_remote_config: ^7.0.1
  firebase_app_check: ^0.5.1
  firebase_crashlytics: ^6.0.1

  # Platform Integration
  share_plus: ^13.3.1
  url_launcher: ^6.2.6
  file_picker: ^13.3.3
  image_picker: ^1.1.2
  record: ^7.2.0
  permission_handler: ^13.0.2
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  google_sign_in: ^6.2.0

  # Background Tasks & Notifications
  workmanager: ^0.10.10
  flutter_local_notifications: ^23.0.1
  timezone: ^0.11.2

  # AI / ML (On-device)
  # Transformers.js via webview or custom dart bindings
  # MediaPipe Tasks via platform channels
  # Whisper.cpp via platform channels

  # Utilities
  intl: ^0.20.3
  uuid: ^4.4.2
  collection: ^1.18.0
  equatable: ^3.0.0
  dartz: ^0.10.1
  logger: ^2.4.0
  pretty_dio_logger: ^1.3.1
  dio: ^5.7.0
  crypto: ^3.0.3
  markdown: ^7.2.0
  flutter_markdown: ^0.7.4

  # UI
  material_symbols_icons: ^4.2670.0
  fl_chart: ^1.3.1
  lottie: ^3.1.2
  shimmer: ^4.0.0
  cached_network_image: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^4.0.10
  freezed: ^4.0.3
  drift_dev: ^2.18.0
  integration_test:
    sdk: flutter
  patrol: ^4.11.0
  mocktail: ^1.0.4
  test: ^1.25.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/images/
    - assets/models/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700